<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOL.lol</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #070709;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        #particle-field {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .dot {
            position: absolute;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            will-change: transform;
            pointer-events: none;
        }

        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(7, 7, 9, 0.95);
            backdrop-filter: blur(8px);
            transition: opacity 1s ease, visibility 1s ease;
            cursor: pointer;
        }
        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .enter-text {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.6em;
            color: rgba(255, 255, 255, 0.25);
            transition: all 0.4s ease;
            text-transform: uppercase;
        }
        .enter-text:hover {
            color: rgba(255, 255, 255, 0.7);
            transform: scale(1.02);
        }

        #main-content {
            opacity: 0;
            transition: opacity 0.01s ease;
            pointer-events: none;
        }
        #main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .animate-item {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1),
                transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        #main-content.visible .animate-item {
            opacity: 1;
            transform: translateY(0);
        }
        #main-content.visible .avatar-container {
            transition-delay: 0.05s;
        }
        #main-content.visible .main-name {
            transition-delay: 0.15s;
        }
        #main-content.visible .typing-wrapper {
            transition-delay: 0.25s;
        }
        #main-content.visible .roles {
            transition-delay: 0.35s;
        }
        #main-content.visible .discord-wrapper {
            transition-delay: 0.50s;
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0 auto 0.6rem auto;
            pointer-events: none;
            flex-shrink: 0;
        }

        .avatar {
            position: relative;
            left: -2%;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            background-image: url('');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0;
        }
        .avatar i {
            opacity: 0.15;
        }

        .main-name {
            font-size: 3.8rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.9);
            margin: 0 auto 0.2rem auto;
            line-height: 1.2;
            text-align: center;
            width: 100%;
        }

        .typing-wrapper {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.35);
            min-height: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2px;
            margin-bottom: 0.2rem;
            width: 100%;
        }
        #typed-text {
            display: inline-block;
            white-space: nowrap;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: rgba(255, 255, 255, 0.4);
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .roles {
            display: flex;
            gap: 2.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            width: 100%;
        }
        .role-badge {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.4rem 1.6rem 0.4rem 1.2rem;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            transition: none !important;
            cursor: default;
        }
        .role-badge:hover {
            transform: none !important;
            border-color: rgba(255, 255, 255, 0.04) !important;
            background: rgba(255, 255, 255, 0.02) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3) !important;
        }
        .role-badge .role-icon {
            font-size: 1.1rem;
            width: 1.4rem;
            text-align: center;
            transition: none !important;
        }
        .role-badge .role-label {
            font-weight: 500;
        }
        .role-badge.verified .role-icon {
            color: rgba(59, 130, 246, 0.8);
        }
        .role-badge.developer .role-icon {
            color: rgba(79, 195, 247, 0.7);
        }

        .discord-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 2.8rem 1rem 2rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: border-color 0.3s ease, background 0.3s ease;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
            min-width: 340px;
        }
        .discord-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
        }
        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
            background-image: url('');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .server-icon i {
            opacity: 0.2;
        }
        .discord-link {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
            letter-spacing: 0.05em;
            background: transparent;
            border: none;
        }
        .discord-link i {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }
        .discord-link:hover {
            color: #5865F2;
        }
        .discord-link:hover i {
            color: #5865F2;
        }
        .discord-link .server-name {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }
        .discord-link:hover .server-name {
            color: rgba(255, 255, 255, 0.9);
        }
        .owner-tag {
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            color: rgba(245, 166, 35, 0.7);
            border: 1px solid rgba(245, 166, 35, 0.15);
            padding: 0.3rem 1.2rem;
            border-radius: 20px;
            background: rgba(245, 166, 35, 0.05);
            text-transform: uppercase;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .discord-wrapper:hover .owner-tag {
            color: rgba(245, 166, 35, 0.95);
            border-color: rgba(245, 166, 35, 0.3);
            background: rgba(245, 166, 35, 0.08);
        }

        #footer-bar {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
        }
        #footer-bar>* {
            pointer-events: auto;
        }
        .audio-player {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 0.5rem 1.5rem 0.5rem 1.2rem;
            border-radius: 60px;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            transition: all 0.3s ease;
        }
        .audio-player:hover {
            border-color: rgba(255, 255, 255, 0.07);
            background: rgba(14, 14, 20, 0.8);
        }
        #playBtn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        #playBtn:hover {
            color: #fff;
            transform: scale(1.15);
        }
        #playBtn:active {
            transform: scale(0.9);
        }
        .track-info {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-info .track-name {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }
        .playing-indicator {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .playing-indicator .bar {
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .playing-indicator .bar.active {
            background: rgba(120, 200, 255, 0.3);
            animation: barPulse 0.8s ease-in-out infinite alternate;
        }
        .playing-indicator .bar:nth-child(2).active {
            animation-delay: 0.2s;
            height: 14px;
        }
        .playing-indicator .bar:nth-child(3).active {
            animation-delay: 0.4s;
            height: 8px;
        }
        .playing-indicator .bar:nth-child(4).active {
            animation-delay: 0.1s;
            height: 12px;
        }
        .playing-indicator .bar:nth-child(5).active {
            animation-delay: 0.3s;
            height: 6px;
        }
        @keyframes barPulse {
            0% {
                height: 4px;
                opacity: 0.1;
            }
            100% {
                height: 16px;
                opacity: 1;
            }
        }

        .volume-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .volume-icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
        }
        .volume-icon-btn:hover {
            color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.03);
        }
        .volume-slider-popup {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            transform-origin: bottom center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(8, 8, 12, 0.9);
            backdrop-filter: blur(16px);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .volume-wrapper:hover .volume-slider-popup,
        .volume-wrapper:focus-within .volume-slider-popup {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }
        #volumeSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 2px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #volumeSlider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        #volumeSlider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
        }
        #volumeSlider:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .volume-level {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            font-weight: 300;
            min-width: 30px;
            text-align: center;
        }

        @media (max-width: 700px) {
            .avatar {
                width: 110px;
                height: 110px;
                font-size: 3rem;
                left: -2%;
            }
            .main-name {
                font-size: 2.8rem;
            }
            .typing-wrapper {
                font-size: 0.9rem;
                padding: 0 1rem;
            }
            #typed-text {
                white-space: normal;
                word-break: break-word;
            }
            .discord-wrapper {
                padding: 0.8rem 1.8rem;
                gap: 1rem;
                min-width: 260px;
            }
        }
        @media (max-width: 450px) {
            .avatar {
                width: 85px;
                height: 85px;
                font-size: 2.2rem;
                left: -3%;
            }
            .main-name {
                font-size: 2.2rem;
            }
            .typing-wrapper {
                font-size: 0.75rem;
            }
            .discord-wrapper {
                padding: 0.6rem 1.2rem;
                gap: 0.6rem;
                min-width: 200px;
            }
            .server-icon {
                width: 32px;
                height: 32px;
            }
            .discord-link {
                font-size: 0.8rem;
            }
            .owner-tag {
                font-size: 0.5rem;
                padding: 0.15rem 0.6rem;
            }
        }
    </style>
</head>
<body>

    <div id="particle-field"></div>

    <div id="enter-overlay">
        <div class="enter-text">CLICK TO ENTER</div>
    </div>

    <div id="main-content">
        <div id="overlay">

            <div class="avatar-container animate-item">
                <div class="avatar" id="profileAvatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <h1 class="main-name animate-item">LOL</h1>

            <div class="typing-wrapper animate-item">
                <span id="typed-text"></span><span class="cursor"></span>
            </div>

            <div class="roles animate-item">
                <div class="role-badge verified">
                    <i class="fas fa-circle-check role-icon"></i>
                    <span class="role-label">Verified</span>
                </div>
                <div class="role-badge developer">
                    <i class="fas fa-code role-icon"></i>
                    <span class="role-label">Developer</span>
                </div>
            </div>

            <div class="discord-wrapper animate-item">
                <div class="server-icon" id="serverIcon">
                    <i class="fas fa-hashtag"></i>
                </div>
                <a href="https://discord.gg/NbypSpEfFX" target="_blank" class="discord-link">
                    <i class="fab fa-discord"></i>
                    <span class="server-name">Entropy</span>
                </a>
                <span class="owner-tag">Owner</span>
            </div>

        </div>

        <div id="footer-bar">
            <div class="audio-player">
                <button id="playBtn"><i class="fas fa-play"></i></button>
                <div class="track-info"><span class="track-name">worry</span></div>
                <div class="playing-indicator">
                    <span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span>
                </div>
                <div class="volume-wrapper">
                    <button class="volume-icon-btn" id="volumeIconBtn"><i class="fas fa-volume-up"></i></button>
                    <div class="volume-slider-popup">
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" />
                        <span class="volume-level" id="volumeLevel">70%</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="bgm" src="worry.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            const enterOverlay = document.getElementById('enter-overlay');
            const mainContent = document.getElementById('main-content');
            const audio = document.getElementById('bgm');
            const playBtn = document.getElementById('playBtn');
            const playIcon = playBtn.querySelector('i');
            const volumeSlider = document.getElementById('volumeSlider');
            const volumeLevel = document.getElementById('volumeLevel');
            const volumeIconBtn = document.getElementById('volumeIconBtn');
            const volumeIcon = volumeIconBtn.querySelector('i');
            const bars = document.querySelectorAll('.playing-indicator .bar');

            function updateVolumeUI(val) {
                const v = parseFloat(val);
                audio.volume = v;
                const percent = Math.round(v * 100);
                volumeLevel.textContent = percent + '%';
                if (v === 0) volumeIcon.className = 'fas fa-volume-off';
                else if (v < 0.5) volumeIcon.className = 'fas fa-volume-down';
                else volumeIcon.className = 'fas fa-volume-up';
            }

            volumeSlider.addEventListener('input', function(e) {
                e.stopPropagation();
                updateVolumeUI(this.value);
            });

            volumeIconBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (audio.volume > 0) {
                    audio.dataset.prevVolume = audio.volume;
                    updateVolumeUI(0);
                    volumeSlider.value = 0;
                } else {
                    const prev = parseFloat(audio.dataset.prevVolume || 0.7);
                    updateVolumeUI(prev);
                    volumeSlider.value = prev;
                }
            });

            updateVolumeUI(volumeSlider.value);

            function updatePlayState(isPlaying) {
                if (isPlaying) {
                    playIcon.className = 'fas fa-pause';
                    bars.forEach(bar => bar.classList.add('active'));
                } else {
                    playIcon.className = 'fas fa-play';
                    bars.forEach(bar => bar.classList.remove('active'));
                }
            }

            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play().then(() => {
                        updatePlayState(true);
                    }).catch(() => {
                        alert('⚠️ 音声ファイル (your-music.mp3) が見つかりません。');
                        updatePlayState(false);
                    });
                } else {
                    audio.pause();
                    updatePlayState(false);
                }
            });

            audio.addEventListener('ended', function() {
                updatePlayState(false);
            });

            enterOverlay.addEventListener('click', function() {
                enterOverlay.classList.add('hidden');
                mainContent.classList.add('visible');
                startTyping();
                audio.play().then(() => {
                    updatePlayState(true);
                }).catch(() => {
                    updatePlayState(false);
                });
            });

            const FIELD = document.getElementById('particle-field');
            const DOT_COUNT = 400;
            const dots = [];
            const rand = (min, max) => Math.random() * (max - min) + min;

            for (let i = 0; i < DOT_COUNT; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                const left = rand(0, 100);
                const top = rand(0, 100);
                const size = rand(0.5, 4.5);
                const finalSize = Math.random() < 0.05 ? rand(4.5, 7) : size;
                dot.style.left = left + '%';
                dot.style.top = top + '%';
                dot.style.width = finalSize + 'px';
                dot.style.height = finalSize + 'px';
                dot.style.opacity = rand(0.3, 1.0);
                const initialOffset = rand(-30, 0);
                dot.style.transform = 'translateY(' + initialOffset + 'px)';
                const data = {
                    el: dot,
                    speed: rand(0.002, 0.018),
                    amplitude: rand(3, 35),
                    phase: rand(0, Math.PI * 2),
                    driftX: Math.random() < 0.3 ? rand(-0.2, 0.2) : 0,
                };
                dots.push(data);
                FIELD.appendChild(dot);
            }

            let startTime = performance.now();

            function animateDots() {
                const now = performance.now();
                const t = (now - startTime) / 1000;
                for (const d of dots) {
                    const offsetY = Math.sin(t * d.speed + d.phase) * d.amplitude;
                    const offsetX = Math.sin(t * d.speed * 0.7 + d.phase * 1.3) * (d.driftX * 8);
                    d.el.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
                }
                requestAnimationFrame(animateDots);
            }
            animateDots();

            const text = "Entropy.lol will become more powerful than any other script.";
            const typedSpan = document.getElementById('typed-text');
            let charIndex = 0;
            let isDeleting = false;
            let isPaused = false;
            let typingStarted = false;

            function typeEffect() {
                if (isPaused) return;
                if (!isDeleting) {
                    if (charIndex < text.length) {
                        typedSpan.textContent += text.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeEffect, 70);
                    } else {
                        isPaused = true;
                        setTimeout(() => {
                            isPaused = false;
                            isDeleting = true;
                            typeEffect();
                        }, 2000);
                    }
                } else {
                    if (charIndex > 0) {
                        typedSpan.textContent = text.substring(0, charIndex - 1);
                        charIndex--;
                        setTimeout(typeEffect, 45);
                    } else {
                        isDeleting = false;
                        isPaused = true;
                        setTimeout(() => {
                            isPaused = false;
                            typeEffect();
                        }, 500);
                    }
                }
            }

            function startTyping() {
                if (typingStarted) return;
                typingStarted = true;
                typeEffect();
            }

        })();
    </script>
</body>
